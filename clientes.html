<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="css/alert.css">
    <link rel="stylesheet" href="css/adminlte.min.css">
    <script src="js/jquery-3.5.0.min.js" type="text/javascript"></script>
    <script src="https://kit.fontawesome.com/c1442bd7da.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="images/tienda.ico" mce_href="images/tienda.ico" type="image/x-icon" />
    <script src="js/sweetalert2.all.min.js" type="text/javascript"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/config.js" type="text/javascript"></script>
    <script src="js/api.js" type="text/javascript"></script>
    <script src="js/clientes.js" type="text/javascript"></script>
    <script src="js/adminlte.js"></script>
    <script src="js/layout.js" type="text/javascript"></script>
    <title>Tienda Zely</title>
</head>

<body class="hold-transition sidebar-mini layout-fixed" data-page="clientes">
    <form id="prin" autocomplete="off">
        <!--MODAL PARA REGISTRAR-->
        <div class="modal fade" id="modalCRUD" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel"></h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                                aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <form id="formPersonas">
                        <div class="modal-body">
                            <div class="form-group">
                                <label for="input-nom_cliente" class="col-form-label">Nombre Cliente</label>
                                <input type="text" class="form-control" id="input-nom_cliente" name="nom_cliente">
                            </div>
                            <div class="form-group">
                                <label for="tipoProducto" class="col-form-label">¿Puede pedir productos a
                                    credito?</label>
                                <div
                                    class="custom-control custom-switch custom-switch-off-danger custom-switch-on-success">
                                    <input type="checkbox" class="custom-control-input" id="input-credito"
                                        name="credito">
                                    <label class="custom-control-label" for="input-credito" id="txtCredito">No</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="input-limit_cred" class="col-form-label">Limite de credito</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">S/ </span>
                                    </div>
                                    <input type="number" class="form-control" id="input-limit_cred" name="limit_cred"
                                        min="0" step="0.10">
                                </div>
                            </div>                            
                            <div class="form-group">
                                <label for="observacion" class="col-form-label">Observacion</label>
                                <input type="text" class="form-control" id="input-observacion" name="observacion">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                            <button type="button" id="btnGuardar" class="btn btn-dark"
                                onclick="registrarCliente();">Registrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!--FIN-->
        <!--MODAL PARA EDITAR-->
        <div class="modal fade" id="modalEdit" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel2"
            aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel2"></h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                                aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <form id="formEditar" autocomplete="off">
                        <input type="hidden" id="input-id_producto_ed" name="id_producto_ed" value="">
                        <div class="modal-body">
                            <div class="form-group">
                                <label for="input-nom_cliente_ed" class="col-form-label">Nombre Cliente</label>
                                <input type="text" class="form-control" id="input-nom_cliente_ed" name="nom_cliente_ed">
                            </div>
                            <div class="form-group">
                                <label for="tipoProducto_ed" class="col-form-label">¿Puede pedir productos a
                                    credito?</label>
                                <div
                                    class="custom-control custom-switch custom-switch-off-danger custom-switch-on-success">
                                    <input type="checkbox" class="custom-control-input" id="input-credito_ed"
                                        name="credito_ed">
                                    <label class="custom-control-label" for="input-credito_ed" id="txtCredito_ed">No</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="input-limit_cred_ed" class="col-form-label">Limite de credito</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">S/ </span>
                                    </div>
                                    <input type="number" class="form-control" id="input-limit_cred_ed" name="limit_cred_ed"
                                        min="0" step="0.10">
                                </div>
                            </div>                            
                            <div class="form-group">
                                <label for="observacion_ed" class="col-form-label">Observacion</label>
                                <input type="text" class="form-control" id="input-observacion_ed" name="observacion_ed">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                            <button type="button" id="btnModificar" class="btn btn-dark"
                                onclick="modificarCliente();">Modificar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!--FIN-->
    </form>
    <div class="wrapper">

        <div id="app-navbar"></div>
        <div id="app-sidebar"></div>
        <div class="content-wrapper">
            <form id="id_form" autocomplete="off" class="form-horizontal col-md-12">
                <br>
                <div class="card">
                    <div class="card-header">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <h5 class="panel-title">Clientes</h5>
                            </div>
                            <div class="form-group col-md-6 text-right">
                                <button id="btnNuevo" type="button" class="btn btn-info btn-circle" data-toggle="modal"
                                    title="Registrar Cliente"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="row">
                            <div class="col-lg-10">
                                <input id="existenciaCodigo" name="existenciaCodigo" type="hidden"
                                    class="existenciaCodigo" value="0">
                                <input id="existenciaValue" name="existenciaValue" type="hidden" class="existenciaValue"
                                    value="0">
                                <input id="busquedaValue" name="busquedaValue" type="hidden" class="busquedaValue"
                                    value="0">
                            </div>
                        </div>
                        <br>
                        <!--TABLA-->
                        <div class="panel-body">
                            <div class="table-responsive" id="divtableproduct" style="height: 300px;">
                                <table id="tablaProducto" class="table table-striped table-bordered"
                                    style="margin: 0 auto;">
                                    <thead class="thead-dark">
                                        <tr>
                                            <th class="text-center">Nombre Cliente</th>
                                            <th class="text-center">¿Tiene cuenta?</th>
                                            <th class="text-center">Observacion</th>
                                            <th class="text-center">Limite cuenta</th>
                                            <th class="text-center">Accion</th>
                                        </tr>
                                    </thead>
                                    <tbody id="bodyTable">

                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <!--FIN-->
                    </div>
                    <div class="card-footer">
                        <div class="float-left">
                            <p id="resultado"></p>
                        </div>
                        <div class="float-right">
                            <input type="checkbox" class="form-check-input" id="chkProdInactivos"
                                onclick="desactivar();">
                            <label class="form-check-label" for="exampleCheck1">Ver clientes inactivos</label>
                        </div>

                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#btnNuevo").click(function () {
                $("#formPersonas").trigger("reset");
                $(".modal-header").css("background-color", "#17a2b8");
                $(".modal-header").css("color", "white");
                $(".modal-title").text("Registrar Cliente");
                $("#modalCRUD").modal("show");
                $("#input-nom_cliente").val('');
                $("#input-credito").prop("checked", false);
                $("#txtCredito").html('NO');
                $("#input-limit_cred").prop('disabled', true);
                $("#input-limit_cred").val('0.0');
                $("#input-observacion").val('');
            });

            $('#input-credito').on('change', function () {
                $(this).is(':checked') ? (
                    $("#txtCredito").html("SI"), 
                    $("#input-limit_cred").prop('disabled', false), 
                    $("#input-limit_cred").val('')) : 
                (
                    $("#txtCredito").html("NO"), 
                    $("#input-limit_cred").prop('disabled', true),
                    $("#input-limit_cred").val('0.0'));
            });

            $('#input-credito_ed').on('change', function () {
                $(this).is(':checked') ? (
                    $("#txtCredito_ed").html("SI"), 
                    $("#input-limit_cred_ed").prop('disabled', false), 
                    $("#input-limit_cred_ed").val('')) : 
                (
                    $("#txtCredito_ed").html("NO"), 
                    $("#input-limit_cred_ed").prop('disabled', true),
                    $("#input-limit_cred_ed").val('0.0'));
            });
        });
    </script>
</body>

</html>
