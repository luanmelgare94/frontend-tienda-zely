<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="css/alert.css">
    <link rel="stylesheet" href="css/adminlte.min.css">
    <script src="js/jquery-3.5.0.min.js" type="text/javascript"></script>
    <script src="https://kit.fontawesome.com/c1442bd7da.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="images/tienda.ico" mce_href="images/tienda.ico" type="image/x-icon" />
    <script src="js/sweetalert2.all.min.js" type="text/javascript"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/config.js" type="text/javascript"></script>
    <script src="js/api.js" type="text/javascript"></script>
    <script src="js/ventas.js" type="text/javascript"></script>
    <script src="js/adminlte.js"></script>
    <script src="js/layout.js" type="text/javascript"></script>
    <title>Tienda Zely</title>
</head>

<body class="hold-transition sidebar-mini layout-fixed" data-page="ventas">
    <form id="prin" autocomplete="off">
        <!--MODAL PARA VER DETALLES-->
        <div class="modal fade" id="modalDetalles" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel"></h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                                aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <form id="formDetallesVenta">
                        <div class="modal-body">
                            <div class="row">
                                <div class="col-sm-4">
                                    <label for="input-nombre_cliente" class="col-form-label">Nombre Cliente:
                                    </label><br>
                                    <label class="col-form-label" id="input-nombre_cliente"></label>
                                </div>
                                <div class="col-sm-4">
                                    <label for="input-tipo_venta" class="col-form-label">Tipo Venta: </label><br>
                                    <label class="col-form-label" id="input-tipo_venta"></label>
                                </div>
                                <div class="col-sm-4">
                                    <label for="input-fecha_venta" class="col-form-label">Fecha Venta: </label><br>
                                    <label class="col-form-label" id="input-fecha_venta"></label>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-4">
                                    <label for="input-pagado" class="col-form-label">¿Pagado? </label><br>
                                    <label class="col-form-label" id="input-pagado"></label>
                                </div>
                                <div class="col-sm-4">
                                    <label for="input-fecha_pagado" class="col-form-label">Fecha Pagado: </label><br>
                                    <label class="col-form-label" id="input-fecha_pagado"></label>
                                </div>
                                <div class="col-sm-4">
                                    <label for="input-importe_total" class="col-form-label">Importe total: S/
                                    </label><br>
                                    <label class="col-form-label" id="input-importe_total"></label>
                                </div>
                            </div>
                            <hr>
                            <div class="table-responsive" id="divTableDetalles" style="height: 300px;">
                                <table id="tablaDetalles" class="table table-striped table-bordered"
                                    style="margin: 0 auto;">
                                    <thead class="thead-dark">
                                        <tr>
                                            <th class="text-center">Nombre Producto</th>
                                            <th class="text-center">Cantidad</th>
                                            <th class="text-center">Unidad</th>
                                            <th class="text-center">Precio</th>
                                        </tr>
                                    </thead>
                                    <tbody id="bodyTableDetalle">

                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!--FIN-->
    </form>
    <div class="wrapper">
        <div id="app-navbar"></div>
        <div id="app-sidebar"></div>
        <div class="content-wrapper">
            <form id="id_form" autocomplete="off" class="form-horizontal col-md-12">
                <br>
                <div class="card">
                    <div class="card-header">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <h5 class="panel-title">Ventas</h5>
                            </div>
                            <div class="form-group col-md-6 text-right">
                                <!--<button id="btnNuevo" type="button" class="btn btn-info btn-circle" data-toggle="modal"
                                    title="Registrar Cliente"><i class="fas fa-plus"></i></button>-->
                            </div>
                        </div>
                    </div>

                    <div class="card-body">
                        <br>
                        <!--TABLA-->
                        <div class="panel-body">
                            <div class="table-responsive" id="divtableproduct" style="height: 300px;">
                                <table id="tablaProducto" class="table table-striped table-bordered"
                                    style="margin: 0 auto;">
                                    <thead class="thead-dark">
                                        <tr>
                                            <th class="text-center">Nombre Cliente</th>
                                            <th class="text-center">Tipo Venta</th>
                                            <th class="text-center">Fecha Venta</th>
                                            <th class="text-center">¿Pagado?</th>
                                            <th class="text-center">Fecha Pago</th>
                                            <th class="text-center">Accion</th>
                                        </tr>
                                    </thead>
                                    <tbody id="bodyTable">

                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <!--FIN-->
                    </div>
                    <div class="card-footer">
                        <div class="float-left">
                            <p id="resultado"></p>
                        </div>
                        <div class="float-right">
                            <div class="custom-control custom-radio">
                                <input class="custom-control-input" type="radio" id="rb-Ventas" name="tip_venta"
                                    checked>
                                <label for="rb-Ventas" class="custom-control-label">Todas las ventas</label>
                            </div>
                            <div class="custom-control custom-radio">
                                <input class="custom-control-input" type="radio" id="rb-VentasPagadas" name="tip_venta">
                                <label for="rb-VentasPagadas" class="custom-control-label">Ventas pagadas</label>
                            </div>
                            <div class="custom-control custom-radio">
                                <input class="custom-control-input" type="radio" id="rb-VentasNoPagadas"
                                    name="tip_venta">
                                <label for="rb-VentasNoPagadas" class="custom-control-label">Ventas no pagadas</label>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
