<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="css/alert.css">
    <link rel="stylesheet" href="css/adminlte.min.css">
    <script src="js/jquery-3.5.0.min.js" type="text/javascript"></script>
    <script src="https://kit.fontawesome.com/c1442bd7da.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="images/tienda.ico" mce_href="images/tienda.ico" type="image/x-icon" />
    <script src="js/sweetalert2.all.min.js" type="text/javascript"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/config.js" type="text/javascript"></script>
    <script src="js/api.js" type="text/javascript"></script>
    <script src="js/cuenta_cliente.js" type="text/javascript"></script>
    <script src="js/adminlte.js"></script>
    <script src="js/layout.js" type="text/javascript"></script>
    <title>Tienda Zely</title>
</head>

<body class="hold-transition sidebar-mini layout-fixed" data-page="cuenta_cliente">
    
    <div class="wrapper">
        <div id="app-navbar"></div>
        <div id="app-sidebar"></div>
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1>Consulta de clientes con cuentas por pagar</h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">

                <div class="container-fluid">
                    <div class="row">
                        <!-- right column -->
                        <div class="col-md-12">
                            <!-- general form elements disabled -->
                            <div class="card card-info">
                                <div class="card-header">
                                    <h3 class="card-title">Cuenta de cliente</h3>
                                </div>
                                <!-- /.card-header -->
                                <div class="card-body">
                                    <form>
                                        <!--INICIO DE FORMULARIO COMUN-->
                                        <div class="row">
                                            <div class="col-sm-4">
                                                <div class="form-group">
                                                    <label>Cliente con ventas por pagar</label>
                                                    <select class="form-control" id="input-cliente">
                                                        <option value="">--SELECCIONE--</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-sm-4">
                                                <div class="form-group">
                                                    <br>
                                                    <button type="button" id="btnConsultarCliente" class="btn btn-dark"
                                                        onclick="consultarCliente();">Consultar</button>
                                                </div>
                                            </div>
                                        </div>
                                        <hr>
                                        <div class="row">
                                            <div class="table-responsive" id="divTablaDetalleVenta"
                                                style="height: 300px;">
                                                <table id="detalleVenta" class="table table-striped table-bordered"
                                                    style="margin: 0 auto;">
                                                    <thead class="thead-dark">
                                                        <tr>
                                                            <th class="text-center">Id</th>
                                                            <th class="text-center">Fecha y hora</th>
                                                            <th class="text-center">Cantidad</th>
                                                            <th class="text-center">Unidad</th>
                                                            <th class="text-center">Nombre Producto</th>
                                                            <th class="text-center">Precio</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="cuerpoTablaDetalleVenta">

                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div class="card-footer">
                                            <div class="float-left">
                                                <p id="resultado"></p>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                <!-- /.card-body -->
                            </div>
                            <!-- /.card -->
                        </div>
                    </div>
                </div>
            </section>
        </div>


    </div>
</body>

</html>
