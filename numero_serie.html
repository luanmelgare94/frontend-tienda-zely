<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="css/alert.css">
    <link rel="stylesheet" href="css/adminlte.min.css">
    <script src="js/jquery-3.5.0.min.js" type="text/javascript"></script>
    <script src="https://kit.fontawesome.com/c1442bd7da.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="images/tienda.ico" mce_href="images/tienda.ico" type="image/x-icon" />
    <script src="js/sweetalert2.all.min.js" type="text/javascript"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/config.js" type="text/javascript"></script>
    <script src="js/api.js" type="text/javascript"></script>
    <script src="js/numero_serie.js" type="text/javascript"></script>
    <script src="js/adminlte.js"></script>
    <script src="js/layout.js" type="text/javascript"></script>
    <title>Tienda Zely</title>
</head>

<body class="hold-transition sidebar-mini layout-fixed" data-page="numero_serie">
    
    <div class="wrapper">
        <div id="app-navbar"></div>
        <div id="app-sidebar"></div>
        <div class="content-wrapper">
            <form id="id_form" autocomplete="off" class="form-horizontal col-md-12">
                <br>
                <div class="card">
                    <div class="card-header">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <h5 class="panel-title">Consultar productos por numero de serie</h5>
                            </div>
                            <div class="form-group col-md-6 text-right">
                            </div>
                        </div>
                    </div>

                    <div class="card-body">
                        <p class="text-muted mb-3">
                            <i class="fas fa-barcode"></i>
                            Escanee el codigo de barras con el lector. La pantalla queda lista para recibir el siguiente codigo.
                        </p>
                        <input type="text" id="input-serial-capture" autocomplete="off"
                            aria-label="Captura de codigo de barras"
                            style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
                        <div class="row">
                            <div class="col-sm-4">
                                <div class="form-group">
                                    <label for="input-numero-serie" class="col-form-label">Numero de serie del producto</label>
                                    <input type="text" class="form-control" id="input-numero-serie" name="numero-serie" disabled>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div id="resultado-serie" class="row d-none">
                            <div class="col-sm-4">
                                <div class="form-group">
                                    <label class="col-form-label">Nombre del producto</label>
                                    <p id="nombre-producto" class="form-control-plaintext font-weight-bold">-</p>
                                </div>
                            </div>
                            <div class="col-sm-4">
                                <div class="form-group">
                                    <label class="col-form-label">Precio</label>
                                    <p id="precio-producto" class="form-control-plaintext font-weight-bold">-</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
