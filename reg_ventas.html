<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="css/alert.css">
    <link rel="stylesheet" href="css/adminlte.min.css">
    <script src="js/jquery-3.5.0.min.js" type="text/javascript"></script>
    <script src="https://kit.fontawesome.com/c1442bd7da.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="images/tienda.ico" mce_href="images/tienda.ico" type="image/x-icon" />
    <script src="js/sweetalert2.all.min.js" type="text/javascript"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/config.js" type="text/javascript"></script>
    <script src="js/api.js" type="text/javascript"></script>
    <script src="js/reg_ventas.js" type="text/javascript"></script>
    <script src="js/adminlte.js"></script>
    <script src="js/layout.js" type="text/javascript"></script>
    <title>Tienda Zely</title>
</head>

<body class="hold-transition sidebar-mini layout-fixed" data-page="reg_ventas">
    <form id="prin" autocomplete="off">
        <!--MODAL PARA REGISTRAR-->
        <div class="modal fade" id="modalCRUD" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel"></h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                                aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <form id="formPersonas">
                        <div class="modal-body">
                            <div class="form-group">
                                <label for="input-nom_cliente" class="col-form-label">Nombre Cliente</label>
                                <input type="text" class="form-control" id="input-nom_cliente" name="nom_cliente">
                            </div>
                            <div class="form-group">
                                <label for="tipoProducto" class="col-form-label">¿Puede pedir productos a
                                    credito?</label>
                                <div
                                    class="custom-control custom-switch custom-switch-off-danger custom-switch-on-success">
                                    <input type="checkbox" class="custom-control-input" id="input-credito"
                                        name="credito">
                                    <label class="custom-control-label" for="input-credito" id="txtCredito">No</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="input-limit_cred" class="col-form-label">Limite de credito</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">S/ </span>
                                    </div>
                                    <input type="number" class="form-control" id="input-limit_cred" name="limit_cred"
                                        min="0" step="0.10">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="observacion" class="col-form-label">Observacion</label>
                                <input type="text" class="form-control" id="input-observacion" name="observacion">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                            <button type="button" id="btnGuardar" class="btn btn-dark"
                                onclick="registrarCliente();">Registrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!--FIN-->
        <!--MODAL PARA EDITAR-->
        <div class="modal fade" id="modalEdit" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel2"
            aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel2"></h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                                aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <form id="formEditar" autocomplete="off">
                        <input type="hidden" id="input-id_producto_ed" name="id_producto_ed" value="">
                        <div class="modal-body">
                            <div class="form-group">
                                <label for="input-nom_cliente_ed" class="col-form-label">Nombre Cliente</label>
                                <input type="text" class="form-control" id="input-nom_cliente_ed" name="nom_cliente_ed">
                            </div>
                            <div class="form-group">
                                <label for="tipoProducto_ed" class="col-form-label">¿Puede pedir productos a
                                    credito?</label>
                                <div
                                    class="custom-control custom-switch custom-switch-off-danger custom-switch-on-success">
                                    <input type="checkbox" class="custom-control-input" id="input-credito_ed"
                                        name="credito_ed">
                                    <label class="custom-control-label" for="input-credito_ed"
                                        id="txtCredito_ed">No</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="input-limit_cred_ed" class="col-form-label">Limite de credito</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">S/ </span>
                                    </div>
                                    <input type="number" class="form-control" id="input-limit_cred_ed"
                                        name="limit_cred_ed" min="0" step="0.10">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="observacion_ed" class="col-form-label">Observacion</label>
                                <input type="text" class="form-control" id="input-observacion_ed" name="observacion_ed">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                            <button type="button" id="btnModificar" class="btn btn-dark"
                                onclick="modificarCliente();">Modificar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!--FIN-->
    </form>
    <div class="wrapper">

        <div id="app-navbar"></div>
        <div id="app-sidebar"></div>
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1>Formulario de Registro</h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">

                <div class="container-fluid">
                    <div class="row">
                        <!-- right column -->
                        <div class="col-md-12">
                            <!-- general form elements disabled -->
                            <div class="card card-info">
                                <div class="card-header">
                                    <h3 class="card-title">Registro de ventas</h3>
                                </div>
                                <!-- /.card-header -->
                                <div class="card-body">
                                    <form>
                                        <!--INICIO DE FORMULARIO COMUN-->
                                        <div class="row">
                                            <div class="col-sm-4">
                                                <div class="form-group">
                                                    <label>Cliente</label>
                                                    <select class="form-control" id="input-cliente">
                                                        <option value="">--SELECCIONE--</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-sm-4">
                                                <div class="form-group">
                                                    <label>Tipo de venta</label>
                                                    <select class="form-control" id="input-tip_venta">
                                                        <option value="">--SELECCIONE--</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-sm-4">
                                                <div class="form-group" id="cancelo">
                                                    <label for="tipoProducto" class="col-form-label">¿Canceló esta
                                                        venta?</label>
                                                    <div
                                                        class="custom-control custom-switch custom-switch-off-danger custom-switch-on-success">
                                                        <input type="checkbox" class="custom-control-input"
                                                            id="input-canc_ven" name="canc_ven">
                                                        <label class="custom-control-label" for="input-canc_ven"
                                                            id="txtCancVen">NO</label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-sm-12">
                                                <div class="form-group">
                                                    <label for="input-observacion_venta"
                                                        class="col-form-label">Observacion Venta</label>
                                                    <input type="text" class="form-control" id="input-observacion_venta"
                                                        name="observacion_venta">
                                                </div>
                                            </div>
                                        </div>
                                        <hr>
                                        <div class="row">
                                            <div class="col-sm-4">
                                                <div class="form-group">
                                                    <label for="input-producto" class="col-form-label">Producto</label>
                                                    <select name="producto" id="input-producto" class="form-control">
                                                        <option value="">--SELECCIONE--</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-sm-2">
                                                <div class="form-group">
                                                    <label for="input-unidad" class="col-form-label">Unidad</label>
                                                    <select name="unidad" id="input-unidad" class="form-control">
                                                        <option value="">--SELECCIONE--</option>
                                                    </select>
                                                    <input type="hidden" id="input-codigoPadre">
                                                </div>
                                            </div>
                                            <div class="col-sm-2">
                                                <div class="form-group">
                                                    <label for="input-cantidad" class="col-form-label">Cantidad</label>
                                                    <input type="text" class="form-control" id="input-cantidad"
                                                        name="cantidad" onkeypress="return validarNumeros(event)" disabled>
                                                </div>
                                            </div>                                            
                                            <div class="col-sm-2">
                                                <div class="form-group">
                                                    <label for="input-precio" class="col-form-label">Precio (S/
                                                        )</label>
                                                    <input type="text" class="form-control" id="input-precio"
                                                        name="precio" onkeypress="return validarNumeros(event)" disabled>
                                                    <input type="hidden" id="input-costo">
                                                </div>
                                            </div>
                                            <div class="col-sm-2">
                                                <div class="form-group">
                                                    <label for="guardarDetalle" class="col-form-label">Añadir
                                                        detalle</label><br>
                                                    <button type="button" id="guardarDetalle" class="btn btn-dark"
                                                        onclick="agregarDetalle();"><i class="fas fa-save"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-sm-12">
                                                <div class="form-group">
                                                    <label for="input-observacion_detalle"
                                                        class="col-form-label">Observacion Detalle</label>
                                                    <input type="text" class="form-control"
                                                        id="input-observacion_detalle" name="observacion_detalle">
                                                </div>
                                            </div>
                                        </div>
                                        <hr>
                                        <div class="row">
                                            <div class="table-responsive" id="divTablaDetalleVenta"
                                                style="height: 300px;">
                                                <table id="detalleVenta" class="table table-striped table-bordered"
                                                    style="margin: 0 auto;">
                                                    <thead class="thead-dark">
                                                        <tr>
                                                            <th class="text-center">Producto</th>
                                                            <th class="text-center">Cantidad</th>
                                                            <th class="text-center">Unidad</th>
                                                            <th class="text-center">Precio</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="cuerpoTablaDetalleVenta">

                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-light"
                                                data-dismiss="modal">Cancelar</button>
                                            <button type="button" id="btnGuardar" class="btn btn-dark"
                                                onclick="registrarVenta();">Registrar</button>
                                        </div>
                                    </form>
                                </div>
                                <!-- /.card-body -->
                            </div>
                            <!-- /.card -->
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('#input-canc_ven').on('change', function () {
                $(this).is(':checked') ? (
                    $("#txtCancVen").html("SI")) :
                    (
                        $("#txtCancVen").html("NO"));
            });
            $("#input-producto").on('change', function () {
                $(this).val() != '' ? listarUnidadDeMedicionPorCodigoProducto($(this).val()) : (
                    $("#input-unidad").html("<option value>--SELECCIONE--</option>"), 
                    $("#input-cantidad").prop('disabled', true), 
                    $("#input-cantidad").val(''), 
                    $("#input-precio").val(''));
            });
            $("#input-tip_venta").on('change', function () {
                $(this).val() == '2' ? $("#cancelo").show() : (
                    $("#cancelo").hide(),
                    $("#input-canc_ven").prop('checked', false),
                    $("#txtCancVen").html("NO"));
            });
            $("#input-unidad").on('change', function () {
                $(this).val() == '' ? ($("#input-cantidad").prop('disabled', true),
                $("#input-cantidad").val(''), 
                $("#input-precio").val('')) : ($("#input-cantidad").prop('disabled', false), $("#input-cantidad").val(''), $("#input-precio").val(''));
            });
            $("#input-cantidad").on('keyup', function () {
                if ($("#input-codigoPadre").val() == '2') {
                    if ($("#input-unidad").val() == '1') {
                        $("#input-precio").val(($("#input-cantidad").val() * $("#input-costo").val()).toFixed(2));
                    } else {
                        $("#input-precio").val((($("#input-cantidad").val() / 1000) * $("#input-costo").val()).toFixed(2));
                    }
                } else {                    
                    $("#input-precio").val(($("#input-cantidad").val() * $("#input-costo").val()).toFixed(2));
                }
                
            });
        });
    </script>
</body>

</html>
